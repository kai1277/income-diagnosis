<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>MIRROR | 美容系転職の年収診断</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #1e191b;
        --panel: #2c2426;
        --panel-raised: #352c2e;
        --cream: #f6efe4;
        --cream-dim: #c9bcae;
        --gold: #c9a063;
        --gold-bright: #e4c388;
        --rose: #e38b72;
        --rose-dim: #8a5346;
        --line: #4a3f3d;
        --ok: #8fae8b;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        background:
          radial-gradient(ellipse 90% 60% at 50% -10%, #3a2e2c 0%, #1a1516 55%),
          #14100f;
        font-family: "Zen Kaku Gothic New", sans-serif;
        color: var(--cream);
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 36px 16px;
      }
      .stage {
        width: 100%;
        max-width: 414px;
      }
      .device {
        position: relative;
        background: linear-gradient(180deg, #231c1e 0%, #1c1618 100%);
        border-radius: 44px;
        padding: 14px;
        box-shadow:
          0 40px 80px -20px rgba(0, 0, 0, 0.65),
          0 0 0 1px rgba(255, 255, 255, 0.04) inset;
      }
      .screen {
        position: relative;
        background: radial-gradient(
          120% 70% at 50% 0%,
          #362b2c 0%,
          #241d1e 60%
        );
        border-radius: 32px;
        min-height: 800px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        font-feature-settings: "palt";
      }
      .notch {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        height: 22px;
        background: #1c1618;
        border-radius: 0 0 16px 16px;
        z-index: 50;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 34px 22px 6px;
        min-height: 34px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: "Shippori Mincho", serif;
        font-weight: 700;
        letter-spacing: 0.14em;
        font-size: 15px;
        color: var(--gold-bright);
      }
      .brand svg {
        width: 18px;
        height: 18px;
      }
      .backbtn {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: var(--cream-dim);
        cursor: pointer;
        transition:
          opacity 0.2s,
          transform 0.2s;
      }
      .backbtn:active {
        transform: scale(0.9);
      }
      .backbtn.hidden {
        visibility: hidden;
      }

      .progress-row {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 16px 22px 4px;
        transition: opacity 0.2s;
      }
      .swatch {
        flex: 1;
        height: 5px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.08);
        position: relative;
        overflow: hidden;
      }
      .swatch i {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, var(--rose), var(--gold-bright));
        transform: scaleX(0);
        transform-origin: left;
        border-radius: 4px;
        transition: transform 0.5s cubic-bezier(0.65, 0, 0.35, 1);
      }
      .swatch.done i {
        transform: scaleX(1);
      }
      .swatch.active i {
        transform: scaleX(1);
      }

      .panels {
        position: relative;
        flex: 1;
        display: flex;
      }
      .panel {
        position: absolute;
        inset: 0;
        padding: 0 24px 24px;
        display: flex;
        flex-direction: column;
        opacity: 0;
        pointer-events: none;
        transform: translateX(24px);
        transition:
          opacity 0.38s ease,
          transform 0.38s cubic-bezier(0.22, 0.9, 0.32, 1);
        overflow-y: auto;
      }
      .panel.active {
        opacity: 1;
        pointer-events: auto;
        transform: translateX(0);
        position: relative;
      }
      .panel.leaving {
        opacity: 0;
        transform: translateX(-24px);
      }

      .intro {
        justify-content: flex-start;
        padding-top: 8px;
      }
      .intro .eyebrow {
        font-size: 11.5px;
        letter-spacing: 0.22em;
        color: var(--gold);
        margin: 14px 0 14px;
      }
      .intro h1 {
        font-family: "Shippori Mincho", serif;
        font-size: 29px;
        line-height: 1.45;
        font-weight: 800;
        margin: 0 0 14px;
        color: var(--cream);
      }
      .intro h1 span {
        color: var(--rose);
      }
      .intro p {
        font-size: 13px;
        line-height: 1.85;
        color: var(--cream-dim);
        margin: 0 0 18px;
      }
      .facts {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      .fact {
        flex: 1;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 11px 10px;
        text-align: center;
      }
      .fact b {
        display: block;
        font-family: "Shippori Mincho", serif;
        font-size: 17px;
        color: var(--gold-bright);
      }
      .fact span {
        display: block;
        font-size: 10px;
        color: var(--cream-dim);
        margin-top: 4px;
      }
      .spacer {
        flex: 1;
        min-height: 14px;
      }

      .job-label-row {
        font-size: 11.5px;
        letter-spacing: 0.16em;
        color: var(--gold);
        margin-bottom: 10px;
      }
      .job-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 10px;
      }
      .job-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px 12px 16px;
        text-align: center;
        cursor: pointer;
        transition:
          border-color 0.2s,
          transform 0.12s,
          background 0.2s;
      }
      .job-card:active {
        transform: scale(0.96);
      }
      .job-card:hover {
        border-color: var(--gold);
      }
      .job-icon {
        width: 38px;
        height: 38px;
        margin: 0 auto 10px;
        color: var(--gold-bright);
      }
      .job-icon svg {
        width: 100%;
        height: 100%;
      }
      .job-label {
        font-family: "Shippori Mincho", serif;
        font-size: 14.5px;
        font-weight: 700;
        color: var(--cream);
        margin-bottom: 5px;
      }
      .job-desc {
        font-size: 10.5px;
        color: var(--cream-dim);
        line-height: 1.5;
      }

      .btn-primary {
        appearance: none;
        border: none;
        cursor: pointer;
        width: 100%;
        padding: 17px 20px;
        border-radius: 999px;
        background: linear-gradient(95deg, var(--gold-bright), var(--gold));
        color: #241a10;
        font-weight: 900;
        font-size: 15px;
        letter-spacing: 0.04em;
        font-family: "Zen Kaku Gothic New", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow: 0 10px 24px -8px rgba(201, 160, 99, 0.55);
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease,
          opacity 0.15s;
        flex-shrink: 0;
      }
      .btn-primary:active {
        transform: scale(0.97);
        box-shadow: 0 4px 14px -6px rgba(201, 160, 99, 0.5);
      }
      .btn-ghost {
        appearance: none;
        border: 1px solid var(--line);
        cursor: pointer;
        width: 100%;
        padding: 15px 20px;
        border-radius: 999px;
        background: transparent;
        color: var(--cream-dim);
        font-size: 13.5px;
        font-family: "Zen Kaku Gothic New", sans-serif;
        margin-top: 10px;
      }

      .q-eyebrow {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        letter-spacing: 0.16em;
        color: var(--gold);
        margin: 18px 0 10px;
      }
      .q-eyebrow .num {
        font-family: "Shippori Mincho", serif;
        font-size: 14px;
        color: var(--rose);
      }
      .q-title {
        font-family: "Shippori Mincho", serif;
        font-size: 21px;
        line-height: 1.5;
        font-weight: 700;
        color: var(--cream);
        margin: 0 0 6px;
      }
      .q-sub {
        font-size: 12px;
        color: var(--cream-dim);
        margin: 0 0 18px;
        line-height: 1.7;
      }
      .options {
        display: flex;
        flex-direction: column;
        gap: 9px;
        margin-bottom: 14px;
      }
      .option {
        position: relative;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 15px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        cursor: pointer;
        transition:
          border-color 0.2s,
          background 0.2s,
          transform 0.12s;
      }
      .option:active {
        transform: scale(0.985);
      }
      .option .tick {
        width: 21px;
        height: 21px;
        border-radius: 50%;
        border: 1.5px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: all 0.2s;
      }
      .option.tick-sq .tick {
        border-radius: 6px;
      }
      .option .tick svg {
        width: 11px;
        height: 11px;
        opacity: 0;
        transform: scale(0.5);
        transition: all 0.2s;
      }
      .option .label {
        font-size: 14px;
        color: var(--cream);
        font-weight: 500;
      }
      .option .desc {
        font-size: 11px;
        color: var(--cream-dim);
        margin-top: 2px;
      }
      .option.selected {
        background: linear-gradient(
          95deg,
          rgba(227, 139, 114, 0.14),
          rgba(201, 160, 99, 0.14)
        );
        border-color: var(--gold);
      }
      .option.selected .tick {
        background: var(--gold);
        border-color: var(--gold);
      }
      .option.selected .tick svg {
        opacity: 1;
        transform: scale(1);
      }

      .slider-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 26px 20px 20px;
        margin-bottom: 16px;
        text-align: center;
      }
      .slider-value {
        font-family: "Shippori Mincho", serif;
        margin-bottom: 18px;
      }
      .slider-value #sliderNum {
        font-size: 44px;
        font-weight: 800;
        color: var(--gold-bright);
      }
      .slider-value small {
        font-size: 15px;
        color: var(--cream-dim);
        margin-left: 4px;
      }
      input[type="range"].range-input {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 6px;
        border-radius: 6px;
        background: linear-gradient(
          90deg,
          var(--rose-dim),
          var(--rose),
          var(--gold-bright)
        );
        outline: none;
        margin: 0 0 14px;
      }
      input[type="range"].range-input::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--cream);
        border: 4px solid var(--gold);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        cursor: pointer;
      }
      input[type="range"].range-input::-moz-range-thumb {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--cream);
        border: 4px solid var(--gold);
        cursor: pointer;
      }
      .slider-labels {
        display: flex;
        justify-content: space-between;
        font-size: 10.5px;
        color: var(--cream-dim);
      }
      .hint-box {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        background: rgba(228, 195, 136, 0.08);
        border: 1px solid rgba(228, 195, 136, 0.2);
        border-radius: 14px;
        padding: 12px 14px;
        margin-bottom: 16px;
      }
      .hint-box .hi {
        font-size: 11px;
        color: var(--cream-dim);
        line-height: 1.7;
      }
      .hint-box .hi b {
        color: var(--gold-bright);
        font-weight: 700;
      }

      .loading {
        align-items: center;
        justify-content: center;
        text-align: center;
        padding-top: 0;
      }
      .loading-ring {
        width: 120px;
        height: 120px;
        position: relative;
        margin-bottom: 26px;
      }
      .loading-ring svg {
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
      }
      .loading-ring .bg {
        fill: none;
        stroke: rgba(255, 255, 255, 0.08);
        stroke-width: 5;
      }
      .loading-ring .fg {
        fill: none;
        stroke: url(#loadGrad);
        stroke-width: 5;
        stroke-linecap: round;
        stroke-dasharray: 326;
        stroke-dashoffset: 326;
        animation: ringfill 2.4s cubic-bezier(0.6, 0, 0.2, 1) forwards;
      }
      @keyframes ringfill {
        to {
          stroke-dashoffset: 24;
        }
      }
      .loading-ring .icon {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .loading h3 {
        font-family: "Shippori Mincho", serif;
        font-size: 18px;
        margin: 0 0 8px;
        font-weight: 700;
      }
      .loading p {
        font-size: 12px;
        color: var(--cream-dim);
        margin: 0;
        line-height: 1.8;
      }
      .loading-lines {
        margin-top: 20px;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .lline {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 11.5px;
        color: var(--cream-dim);
        opacity: 0;
        transform: translateY(6px);
        animation: lin 0.5s ease forwards;
      }
      .lline .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--line);
        flex-shrink: 0;
        transition: background 0.3s;
      }
      .lline.on .dot {
        background: var(--ok);
        box-shadow: 0 0 8px rgba(143, 174, 139, 0.7);
      }
      .lline.on {
        color: var(--cream);
      }
      @keyframes lin {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .result {
        padding-top: 4px;
      }
      .result-eyebrow {
        text-align: center;
        font-size: 10.5px;
        letter-spacing: 0.22em;
        color: var(--gold);
        margin: 10px 0 4px;
      }
      .result-name {
        text-align: center;
        font-family: "Shippori Mincho", serif;
        font-size: 14px;
        color: var(--cream-dim);
        margin-bottom: 14px;
      }
      .gauge-wrap {
        position: relative;
        width: 100%;
        display: flex;
        justify-content: center;
        margin-bottom: 4px;
      }
      .gauge-wrap svg {
        width: 270px;
        max-width: 100%;
      }
      .gauge-number {
        position: absolute;
        top: 90px;
        left: 0;
        right: 0;
        text-align: center;
      }
      .gauge-number .yen {
        font-size: 11.5px;
        color: var(--gold-bright);
        letter-spacing: 0.1em;
      }
      .gauge-number .amt {
        font-family: "Shippori Mincho", serif;
        font-weight: 800;
        font-size: 38px;
        color: var(--cream);
        line-height: 1.1;
      }
      .gauge-number .amt small {
        font-size: 15px;
        font-weight: 600;
        margin-left: 2px;
        color: var(--cream-dim);
      }
      .gauge-number .range {
        font-size: 10.5px;
        color: var(--cream-dim);
        margin-top: 4px;
      }

      .card-cert {
        margin-top: 10px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--panel);
        padding: 16px 16px 4px;
      }
      .cert-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 10.5px;
        letter-spacing: 0.1em;
        color: var(--gold);
        margin-bottom: 12px;
      }
      .cert-title span:last-child {
        color: var(--cream-dim);
        letter-spacing: 0.02em;
      }
      .tag-row {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        padding-bottom: 14px;
        border-bottom: 1px dashed var(--line);
        margin-bottom: 14px;
      }
      .tag {
        font-size: 11px;
        padding: 7px 11px;
        border-radius: 999px;
        background: rgba(228, 195, 136, 0.1);
        color: var(--gold-bright);
        border: 1px solid rgba(228, 195, 136, 0.25);
      }

      .breakdown-list {
        padding-bottom: 14px;
      }
      .b-row {
        display: flex;
        align-items: baseline;
        gap: 6px;
        font-size: 12px;
        color: var(--cream-dim);
        padding: 6px 0;
      }
      .b-row .b-label {
        white-space: nowrap;
      }
      .b-row .b-dots {
        flex: 1;
        border-bottom: 1px dotted var(--line);
        transform: translateY(-3px);
      }
      .b-row .b-val {
        white-space: nowrap;
        color: var(--cream);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .b-row.total {
        margin-top: 6px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
      }
      .b-row.total .b-label {
        font-family: "Shippori Mincho", serif;
        font-size: 14px;
        color: var(--gold-bright);
        font-weight: 700;
      }
      .b-row.total .b-val {
        font-family: "Shippori Mincho", serif;
        font-size: 17px;
        color: var(--gold-bright);
        font-weight: 800;
      }

      .cta-block {
        margin-top: 18px;
      }
      .fine {
        text-align: center;
        font-size: 10px;
        color: var(--cream-dim);
        margin-top: 12px;
        line-height: 1.7;
        padding-bottom: 6px;
      }

      .home-indicator {
        position: absolute;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 120px;
        height: 4px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.25);
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.001ms !important;
          transition-duration: 0.001ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="device">
        <div class="screen" id="screen">
          <div class="notch"></div>
          <div class="topbar">
            <div class="backbtn hidden" id="backBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <path
                  d="M15 19l-7-7 7-7"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </div>
            <div class="brand">
              <svg viewBox="0 0 24 24" fill="none">
                <path
                  d="M12 2v20M6 6l6 6-6 6M18 6l-6 6 6 6"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                />
              </svg>
              MIRROR
            </div>
            <div style="width: 34px"></div>
          </div>
          <div class="progress-row" id="progressRow"></div>
          <div class="panels" id="panels"></div>
          <div class="home-indicator"></div>
        </div>
      </div>
    </div>

    <script>
      /* ---------------------------------------------------------
   ICONS (small line icons for job cards)
--------------------------------------------------------- */
      const ICONS = {
        hair: `<svg viewBox="0 0 24 24" fill="none"><path d="M6 5l12 14M18 5L6 19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="6" cy="5" r="2.1" stroke="currentColor" stroke-width="1.6"/><circle cx="6" cy="19" r="2.1" stroke="currentColor" stroke-width="1.6"/></svg>`,
        nail: `<svg viewBox="0 0 24 24" fill="none"><path d="M9 3h6v4l1.5 2v9a2 2 0 0 1-2 2h-5a2 2 0 0 1-2-2V9L9 7V3z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M9 10h6" stroke="currentColor" stroke-width="1.3"/></svg>`,
        lash: `<svg viewBox="0 0 24 24" fill="none"><path d="M3 14c3-6 15-6 18 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M6 13l-1.4 3M10 11.3L9.3 14.7M14 11.3l.7 3.4M18 13l1.4 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>`,
        esthe: `<svg viewBox="0 0 24 24" fill="none"><path d="M12 3c3 3.2 5 6.4 5 9.2A5 5 0 0 1 7 12.2C7 9.4 9 6.2 12 3z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 21v-6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`,
      };

      /* ---------------------------------------------------------
   SHARED REFERENCE DATA
--------------------------------------------------------- */

          cx = 140,
          cy = 120,
          startAngle = 200,
          endAngle = -20;
        const toRad = (d) => (d * Math.PI) / 180;
        const point = (ang, rad) => ({
          x: cx + rad * Math.cos(toRad(ang)),
          y: cy - rad * Math.sin(toRad(ang)),
        });
        const p0 = point(startAngle, r),
          p1 = point(endAngle, r);
        return `
  <svg viewBox="0 0 280 150" id="gaugeSvg">
    <defs>
      <linearGradient id="gaugeGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#8A5346"/><stop offset="50%" stop-color="#E38B72"/><stop offset="100%" stop-color="#E4C388"/>
      </linearGradient>
    </defs>
    <path d="M ${p0.x} ${p0.y} A ${r} ${r} 0 0 1 ${p1.x} ${p1.y}" stroke="rgba(255,255,255,0.08)" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path id="gaugeFg" d="M ${p0.x} ${p0.y} A ${r} ${r} 0 0 1 ${p1.x} ${p1.y}" stroke="url(#gaugeGrad)" stroke-width="14" fill="none" stroke-linecap="round" stroke-dasharray="315" stroke-dashoffset="315"/>
    <circle cx="${cx}" cy="${cy}" r="5" fill="#E4C388"/>
    <line id="needle" x1="${cx}" y1="${cy}" x2="${p0.x}" y2="${p0.y}" stroke="#F6EFE4" stroke-width="2.5" stroke-linecap="round"/>
  </svg>`;
      }

      /* ---------------------------------------------------------
   NAVIGATION
--------------------------------------------------------- */
      function panelFor(s) {
        if (s === 0) return buildJobSelect();
        const tq = totalQ();
        if (s >= 1 && s <= tq) return buildQuestion(s - 1);
        if (s === tq + 1) return buildLoading();
        return buildResult();
      }

      function goTo(newStep) {
        const old = panelsEl.querySelector(".panel.active");
        step = newStep;
        const next = panelFor(step);
        panelsEl.appendChild(next);
        requestAnimationFrame(() => {
          if (old) {
            old.classList.add("leaving");
            old.classList.remove("active");
          }
          next.classList.add("active");
          setTimeout(() => {
            if (old) old.remove();
          }, 420);
        });
        renderProgress();
        renderBack();
        bindPanelEvents(next);
        if (step === totalQ() + 1) runLoadingSequence();
      }

      function bindPanelEvents(panel) {
        const searchBtn = panel.querySelector("#searchBtn");
        if (searchBtn)
          searchBtn.addEventListener("click", () => {
            searchBtn.innerHTML = "求人を検索しています…";
            searchBtn.style.opacity = "0.75";
          });
        const retryBtn = panel.querySelector("#retryBtn");
        if (retryBtn)
          retryBtn.addEventListener("click", () => {
            Object.keys(answers).forEach((k) => delete answers[k]);
            currentJobId = null;
            goTo(0);
          });
        if (step === totalQ() + 2) animateGaugeAndCount(panel);
      }

      function runLoadingSequence() {
        LOADING_LINES.forEach((_, i) => {
          setTimeout(
            () => {
              const el = document.getElementById("lline" + i);
              if (el) el.classList.add("on");
            },
            260 + i * 430,
          );
        });
        setTimeout(() => {
          if (step === totalQ() + 1) goTo(totalQ() + 2);
        }, 2650);
      }

      function animateGaugeAndCount(panel) {
        const job = currentJob();
        const est = job.calc(answers);
        const fg = panel.querySelector("#gaugeFg");
        const needle = panel.querySelector("#needle");
        const countEl = panel.querySelector("#countNum");
        const cx = 140,
          cy = 120,
          r = 100,
          startAngle = 200,
          endAngle = -20;
        const toRad = (d) => (d * Math.PI) / 180;
        const fullLen = 315;

        requestAnimationFrame(() => {
          fg.style.transition =
            "stroke-dashoffset 1.4s cubic-bezier(.22,.9,.32,1)";
          fg.style.strokeDashoffset = fullLen - fullLen * est.pct;
        });

        const duration = 1400;
        const t0 = performance.now();
        function frame(t) {
          const elapsed = Math.min((t - t0) / duration, 1);
          const eased = 1 - Math.pow(1 - elapsed, 3);
          const curPct = eased * est.pct;
          const ang = startAngle + (endAngle - startAngle) * curPct;
          const x = cx + (r - 14) * Math.cos(toRad(ang));
          const y = cy - (r - 14) * Math.sin(toRad(ang));
          needle.setAttribute("x2", x);
          needle.setAttribute("y2", y);
          countEl.textContent = Math.round(eased * est.center);
          if (elapsed < 1) requestAnimationFrame(frame);
          else countEl.textContent = est.center;
        }
        requestAnimationFrame(frame);
      }

      /* ---------------------------------------------------------
   INIT
--------------------------------------------------------- */
      backBtn.addEventListener("click", () => {
        if (step > 0 && step <= totalQ()) goTo(step - 1);
      });

      goTo(0);
    </script>
  </body>
</html>
